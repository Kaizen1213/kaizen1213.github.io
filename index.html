<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Elizabethpos1 | Dota 2 Edits</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow: hidden;
        }

        .card {
            max-width: 340px;
            width: 100%;
            background: rgba(15, 15, 25, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px 18px;
            text-align: center;
            border: 1px solid rgba(230, 230, 168, 0.25);
            box-shadow: 
                0 0 30px rgba(230, 230, 168, 0.15),
                0 0 60px rgba(230, 230, 168, 0.08),
                0 0 90px rgba(230, 230, 168, 0.04),
                0 25px 50px -12px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.8s ease-out, glowPulse 3.5s ease-in-out infinite;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes glowPulse {
            0% {
                box-shadow: 
                    0 0 30px rgba(230, 230, 168, 0.15),
                    0 0 60px rgba(230, 230, 168, 0.08),
                    0 0 90px rgba(230, 230, 168, 0.04),
                    0 25px 50px -12px rgba(0, 0, 0, 0.6);
            }
            50% {
                box-shadow: 
                    0 0 45px rgba(230, 230, 168, 0.35),
                    0 0 80px rgba(230, 230, 168, 0.18),
                    0 0 120px rgba(230, 230, 168, 0.08),
                    0 25px 50px -12px rgba(0, 0, 0, 0.6);
            }
            100% {
                box-shadow: 
                    0 0 30px rgba(230, 230, 168, 0.15),
                    0 0 60px rgba(230, 230, 168, 0.08),
                    0 0 90px rgba(230, 230, 168, 0.04),
                    0 25px 50px -12px rgba(0, 0, 0, 0.6);
            }
        }

        /* АВАТАРКА — ВСТРОЕННАЯ (base64), НЕ ЗАВИСИТ ОТ ВНЕШНИХ ССЫЛОК */
        .avatar {
            width: 80px;
            height: 80px;
            background-color: #1a1a2e;
            border-radius: 50%;
            margin: 0 auto 12px;
            border: 2px solid rgba(230, 230, 168, 0.3);
            box-shadow: 0 0 30px rgba(230, 230, 168, 0.15);
            animation: avatarFloat 4s ease-in-out infinite;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="%231a1a2e" stroke="%23e6e6a8" stroke-width="2"/><text x="50" y="58" font-size="38" text-anchor="middle" fill="%23e6e6a8" font-family="Arial">🎮</text></svg>');
            background-size: cover;
            background-position: center;
        }

        @keyframes avatarFloat {
            0% { transform: translateY(0px); box-shadow: 0 0 30px rgba(230, 230, 168, 0.15); }
            50% { transform: translateY(-5px); box-shadow: 0 0 50px rgba(230, 230, 168, 0.25); }
            100% { transform: translateY(0px); box-shadow: 0 0 30px rgba(230, 230, 168, 0.15); }
        }

        h1 {
            color: white;
            font-size: 20px;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .badge {
            display: inline-block;
            background: rgba(230, 230, 168, 0.15);
            color: #e6e6a8;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 14px;
            border: 1px solid rgba(230, 230, 168, 0.3);
        }

        .description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12.5px;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .old-school {
            color: #e6e6a8;
            font-size: 13px;
            font-weight: 700;
            margin-top: -6px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(230, 230, 168, 0.1);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .btn-tiktok {
            background: linear-gradient(135deg, #000000, #1a1a1a);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-tiktok:hover {
            border-color: #e6e6a8;
            box-shadow: 0 0 30px rgba(230, 230, 168, 0.15);
        }

        .btn-telegram {
            background: linear-gradient(135deg, #0088cc, #006699);
            color: white;
        }

        .btn-telegram:hover {
            box-shadow: 0 0 30px rgba(0, 136, 204, 0.3);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stat {
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat:hover {
            transform: scale(1.05);
        }

        .stat-number {
            color: white;
            font-size: 15px;
            font-weight: 700;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .footer {
            margin-top: 14px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 9px;
        }

        /* 📱 ОСОБЫЙ РЕЖИМ ДЛЯ МОБИЛЬНЫХ — вот тут весь приоритет */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .card {
                max-width: 320px;
                padding: 18px 14px;
                border-radius: 24px;
            }
            .avatar {
                width: 68px;
                height: 68px;
                margin-bottom: 10px;
            }
            h1 {
                font-size: 18px;
            }
            .badge {
                font-size: 10px;
                padding: 2px 8px;
                margin-bottom: 10px;
            }
            .description {
                font-size: 11px;
                margin-bottom: 12px;
            }
            .old-school {
                font-size: 11px;
                padding: 3px 10px;
                margin-bottom: 12px;
            }
            .btn {
                padding: 8px 12px;
                font-size: 12px;
                gap: 8px;
            }
            .btn svg {
                width: 16px;
                height: 16px;
            }
            .stats {
                gap: 12px;
                padding-top: 10px;
            }
            .stat-number {
                font-size: 13px;
            }
            .stat-label {
                font-size: 8px;
            }
            .footer {
                font-size: 8px;
                margin-top: 10px;
            }
        }

        /* совсем маленькие экраны (до 380px) */
        @media (max-width: 380px) {
            .card {
                max-width: 280px;
                padding: 14px 10px;
            }
            .avatar {
                width: 56px;
                height: 56px;
            }
            h1 {
                font-size: 16px;
            }
            .description {
                font-size: 10px;
            }
            .old-school {
                font-size: 10px;
            }
            .btn {
                font-size: 11px;
                padding: 6px 10px;
            }
            .stat-number {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

        <div class="avatar"></div>
        
        <h1>Elizabethpos1</h1>
        <div class="badge">Dota 2 Edits 🎬</div>
        
        <div class="description">

        <div class="old-school">🔥 будешь гордиться что ты олд 🔥</div>
        
        <div class="links">
            <a href="https://www.tiktok.com/@elizabethpos1" target="_blank" class="btn btn-tiktok">

                    <path d="M19.589 6.686a5.037 5.037 0 0 1-3.888-1.77 5.037 5.037 0 0 1-1.248-3.416h-2.82v13.3a3.02 3.02 0 0 1-3.01 2.79 3.02 3.02 0 0 1-3.011-2.79 3.02 3.02 0 0 1 3.01-2.79c.244 0 .482.034.71.093V9.536a5.88 5.88 0 0 0-.71-.046 5.88 5.88 0 0 0-5.882 5.882 5.88 5.88 0 0 0 5.882 5.882 5.88 5.88 0 0 0 5.882-5.882v-6.49a7.05 7.05 0 0 0 4.3 1.47V7.857c-.233 0-.46-.03-.681-.086a5.06 5.06 0 0 1-1.126-.714 5.03 5.03 0 0 1-1.436-1.778h.001z" fill="white"/>

            <a href="https://t.me/elizabethpos1" target="_blank" class="btn btn-telegram">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

        <div class="stats">

            <div class="stat">
                <div class="stat-number">24K+</div>
                <div class="stat-label">Likes</div>
            </div>
        </div>
        
        <div class="footer">
            Scan again — updates daily 🔥
        </div>
    </div>
</body>
</html>
