<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <!-- Фавиконы из архива favicon.io -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <style>
        /* Весь твой старый стиль остаётся без изменений */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;  /* полностью убирает скролл */
    height: 100vh;     /* фиксирует высоту на весь экран */
    margin: 0;
    padding: 0;
        }

        .card {
            max-width: 400px;
            width: 100%;
            background: rgba(15, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 30px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: url('https://i.postimg.cc/XNsKnH3z/a03fd0d7-6dc0-4c55-bc67-2d86589d75e4.jpg') center center / cover no-repeat;
            background-color: #1a1a2e;
            border-radius: 50%;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(230, 230, 168, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .badge {
            display: inline-block;
            background: rgba(230, 230, 168, 0.15);
            color: #e6e6a8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 20px;
            border: 1px solid rgba(230, 230, 168, 0.3);
        }

        .description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .old-school {
            color: #e6e6a8;
            font-size: 15px;
            font-weight: 700;
            margin-top: -10px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(230, 230, 168, 0.1);
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-tiktok {
            background: linear-gradient(135deg, #000000, #1a1a1a);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-tiktok:hover {
            transform: translateY(-2px);
            border-color: #e6e6a8;
        }

        .btn-telegram {
            background: linear-gradient(135deg, #0088cc, #006699);
            color: white;
        }

        .btn-telegram:hover {
            transform: translateY(-2px);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 8px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeIn 0.5s ease-out;
            max-height: 98vh;   /* гарантия, что карточка не вылезет за экран */
    overflow-y: auto;   /* если вдруг контент всё же не влезет — скролл будет только у карточки, но у тебя не влезет */
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 20px;
            }
            .btn {
                padding: 12px 16px;
                font-size: 14px;
            }
            .avatar {
                width: 80px;
                height: 80px;
            }
            .old-school {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21.5 4.5L2.5 10.5C1.5 10.9 1.5 11.9 2.4 12.3L6.5 14L18.5 7.5C19 7.2 19.5 7.6 19.1 8L9.5 16.5V21L12.5 18.5L16.5 21L21.5 4.5Z" fill="white"/>

                <div class="stat-number">24K+</div>

        <div class="footer">
            Scan again — updates daily 🔥

    </div>
</body>
</html>
