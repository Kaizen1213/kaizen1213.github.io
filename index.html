<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabethpos1 | Dota 2 Edits</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 400px;
            width: 100%;
            background: rgba(15, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 30px 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #ff4655, #b02a37);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 48px;
        }
        h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .badge {
            background: rgba(255, 70, 85, 0.2);
            color: #ff4655;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: 0.2s;
        }
        .btn-tiktok {
            background: #000000;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-telegram {
            background: #0088cc;
            color: white;
        }
        .btn-youtube {
            background: #ff0000;
            color: white;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-number {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }
        .stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
        }
        .footer {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
        }
        @media (max-width: 480px) {
            .card { padding: 24px 20px; }
            .btn { padding: 12px 16px; font-size: 14px; }
            .avatar { width: 80px; height: 80px; font-size: 38px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">🎮</div>
        <h1>Elizabethpos1</h1>
        <div class="badge">Dota 2 Edits 🎬</div>
        <div class="description">
            Качественные эдиты по Dota 2<br>
            4K обои, исходники, музыка из видео<br>
            Скоро стримы и касты турниров 🔥
        </div>
        <div class="links">
            <a href="https://www.tiktok.com/@elizabethpos1" target="_blank" class="btn btn-tiktok">📱 TikTok →</a>
            <a href="https://t.me/elizabethpos1" target="_blank" class="btn btn-telegram">💬 Telegram →</a>
            <a href="https://youtube.com/@elizabethpos1" target="_blank" class="btn btn-youtube">▶️ YouTube / Shorts →</a>
        </div>
        <div class="stats">
            <div class="stat"><div class="stat-number">100+</div><div class="stat-label">TikTok</div></div>
            <div class="stat"><div class="stat-number">174K</div><div class="stat-label">Top Video</div></div>
            <div class="stat"><div class="stat-number">24K+</div><div class="stat-label">Likes</div></div>
        </div>
        <div class="footer">Scan again — updates daily 🔥</div>
    </div>
</body>
</html>
