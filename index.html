<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabethpos1 | Dota 2 Edits</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .card {
            max-width: 340px;
            width: 100%;
            background: #0e0e0e;
            border-radius: 28px;
            padding: 28px 20px 24px;
            text-align: center;
            border: 1px solid rgba(230, 230, 168, 0.15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
        }

        /* Аватарка — из репозитория */
        .avatar {
            width: 80px;
            height: 80px;
            background: url('avatar.jpg') center center / cover no-repeat;
            background-color: #0e0e0e;
            border-radius: 50%;
            margin: 0 auto 14px;
            border: 1px solid rgba(230, 230, 168, 0.2);
        }

        h1 {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .badge {
            display: inline-block;
            background: rgba(230, 230, 168, 0.12);
            color: #e6e6a8;
            font-size: 11px;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(230, 230, 168, 0.15);
            margin-bottom: 14px;
        }

        .description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .old-school {
            color: #e6e6a8;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            background: rgba(230, 230, 168, 0.06);
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 18px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid transparent;
            transition: opacity 0.15s ease;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn-tiktok {
            background: #111111;
            color: white;
            border-color: rgba(255, 255, 255, 0.08);
        }

        .btn-telegram {
            background: #0088cc;
            color: white;
        }

        /* Фикс для иконок — теперь идеально ровные */
        .btn svg {
            display: block;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            fill: white;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            color: white;
            font-size: 16px;
            font-weight: 700;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        .footer {
            margin-top: 14px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 9px;
        }

        /* Мобильная адаптация */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .card {
                max-width: 320px;
                padding: 22px 16px 18px;
                border-radius: 24px;
            }
            .avatar { width: 68px; height: 68px; margin-bottom: 10px; }
            h1 { font-size: 18px; }
            .badge { font-size: 10px; padding: 3px 10px; margin-bottom: 10px; }
            .description { font-size: 12px; margin-bottom: 12px; }
            .old-school { font-size: 11px; padding: 3px 10px; margin-bottom: 14px; }
            .btn { padding: 10px 14px; font-size: 13px; gap: 8px; }
            .btn svg { width: 18px; height: 18px; }
            .stats { gap: 14px; padding-top: 12px; }
            .stat-number { font-size: 14px; }
            .stat-label { font-size: 8px; }
            .footer { font-size: 8px; margin-top: 10px; }
        }

        @media (max-width: 380px) {
            .card {
                max-width: 280px;
                padding: 16px 10px 14px;
                border-radius: 20px;
            }
            .avatar { width: 56px; height: 56px; }
            h1 { font-size: 16px; }
            .description { font-size: 10.5px; }
            .old-school { font-size: 10px; }
            .btn { font-size: 11px; padding: 8px 10px; }
            .btn svg { width: 16px; height: 16px; }
            .stat-number { font-size: 12px; }
        }
    </style>
</head>

</body>
</html>
